# NGEssentials credentials for the docker compose stack.
#
# Mounted over /home/plugin_data/NGEssentials/credentials/credentials.yml. The host names match the
# compose service names, so this only works inside that network — a standalone `docker run` uses the
# blank file the plugin ships instead.
#
# Read only when NGEssentials is in development mode. In production it reads DB_HOST, DB_USER,
# DB_PASSWORD, DB_SCHEMA and VOTE_KEY from the environment instead.
database:
  host: 'mariadb'
  username: 'root'
  password: 'nethergames'
  schema: 'ngdata'

# SkyBlock keeps its own schema and reads this block.
sb_database:
  host: 'mariadb'
  username: 'root'
  password: 'nethergames'
  schema: 'skyblock'

# Factions likewise, under its own key.
fc_database:
  host: 'mariadb'
  username: 'root'
  password: 'nethergames'
  schema: 'factions'

vote_key: ''
kafka_ip: ''
